[project]
name = "eurogreen_python_utils"
version = "0.1.0"
description = "Python utils for data processing for the Eurogreen model family"
readme = "README.md"
authors = [
    { name = "Topi-Matti Heikkola", email = "topi-matti@heikkola.fi" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.1",
    "odfpy>=1.4.1",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "requests>=2.34.2",
]
license = "GPL-3.0-or-later"
license-files= ["LICENSE"]

[project.scripts]
eurogreen-python-utils = "eurogreen_python_utils:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.setuptools.package-data]
eurogreen_python_utils = ["*.ods"]
"eurogreen_python_utils.mappings" = ["*.ods"]
